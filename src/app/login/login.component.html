<div class="container-fluid">
    <div class="row content-center justify-content-center">
        <div class="container" #container id="container" [ngClass]="{'right-panel-active': id%2==0 }">
            <div class="form-container sign-up-container">
                <form action="#">
                    <div class="cardHead">
                        <h1>Create Account</h1>
                    </div>
                    <div class="form-group">
                        <input type="text" formControlName="userName" placeholder="Name" />
                    </div>
                    <div class="form-group">
                        <input type="email" formControlName="email" placeholder="Email" />
                    </div>
                    <div class="form-group">
                        <input type="password" formControlName="password" placeholder="Password" />
                    </div>

                    <button class="btn">Sign Up</button>
                </form>
            </div>
            <div class="form-container sign-in-container">
                <form action="#">
                    <div class="cardHead">
                        <h1>Sign in</h1>
                    </div>
                    <div class="form-group">
                        <input type="email" formControlName="userName" placeholder="Email" />
                    </div>
                    <div class="form-group">
                        <input type="password" formControlName="password" placeholder="Password" />
                    </div>
                    <a href="#">Forgot your password?</a>
                    <button>Sign In</button>
                </form>
            </div>
            <div class="overlay-container">
                <div class="overlay">
                    <div class="overlay-panel overlay-left">
                        <h1>Welcome Back!</h1>
                        <p>To keep connected with us please login with your personal info</p>
                        <button class="ghost" id="signIn" (click)="signIn()">Sign In</button>
                    </div>
                    <div class="overlay-panel overlay-right">
                        <h1>Hello, Friend!</h1>
                        <p>Enter your personal details and start journey with us</p>
                        <button class="ghost" id="signUp" (click)="signUp()">Sign Up</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
